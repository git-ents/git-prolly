[workspace]
members = ["crates/git-database", "crates/git-prolly", "crates/test-support"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
criterion = "0.5"
facet = { version = "=0.50.0-rc.7", features = ["reflect"] }
facet-git-tree = { git = "https://github.com/git-ents/facet-git-tree", features = ["value"] }
facet-json = "0.50.0-rc.7"
facet-value = "0.50.0-rc.7"
git-database = { path = "crates/git-database", default-features = false }
git-prolly = { path = "crates/git-prolly" }
gix = { version = "0.85.0", default-features = false }
gix-refstore = { git = "https://github.com/git-ents/git-store" }
tempfile = "3"
test-support = { path = "crates/test-support" }
thiserror = "2"
