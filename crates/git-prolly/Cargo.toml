[package]
name = "git-prolly"
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
facet = { version = "=0.50.0-rc.5", features = ["reflect"] }
facet-value = "0.50.0-rc.5"
facet-git-tree = { git = "https://github.com/git-ents/git-store", version = "0.1.0", features = [
    "value",
] }
gix = { version = "0.85.0", default-features = false, features = [
    "sha1",
    "sha256",
    "zlib-rs",
] }
thiserror = "2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "prolly"
harness = false

[lints]
workspace = true
